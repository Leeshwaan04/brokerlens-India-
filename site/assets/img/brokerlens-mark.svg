  <path d="M-24 392 L146 340 L212 288 L272 336 L360 190 L528 128" fill="none" stroke="#0f7a4d"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#bl-lens-mark)"/>
