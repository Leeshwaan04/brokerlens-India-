<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1128px;
    height: 191px;
    background: #0a0f1d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
  }

  /* Background Glow and Grid */
  .bg-glow-1 {
    position: absolute;
    width: 480px;
    height: 480px;
    right: -60px;
    top: -140px;
    background: radial-gradient(circle, rgba(15, 122, 77, 0.22) 0%, rgba(15, 122, 77, 0) 70%);
    pointer-events: none;
  }
  .bg-glow-2 {
    position: absolute;
    width: 420px;
    height: 420px;
    left: 280px;
    top: -120px;
    background: radial-gradient(circle, rgba(47, 74, 143, 0.28) 0%, rgba(47, 74, 143, 0) 70%);
    pointer-events: none;
  }
  .grid-pattern {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* Decorative Market Wave on the Right */
  .market-wave {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 440px;
    opacity: 0.25;
    pointer-events: none;
  }

  /* Container leaving left 240px safe for the circular company logo badge */
  .content {
    position: relative;
    z-index: 2;
    padding-left: 250px;
    padding-right: 48px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .left-col {
    max-width: 620px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .brand-title {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand-title .accent {
    color: #10b981;
  }

  .badge-tag {
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: #34d399;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 9999px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .tagline {
    font-size: 14.5px;
    color: #cbd5e1;
    font-weight: 400;
    margin-bottom: 12px;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .tagline strong {
    color: #ffffff;
    font-weight: 600;
  }

  .features {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .feature-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 500;
    color: #e2e8f0;
  }
  .feature-pill svg {
    color: #10b981;
    flex-shrink: 0;
  }

  .right-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .domain-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, rgba(47, 74, 143, 0.45) 0%, rgba(15, 122, 77, 0.35) 100%);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.02em;
  }
  .domain-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }

  .sub-note {
    font-size: 11px;
    color: #94a3b8;
    text-align: right;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="grid-pattern"></div>

  <!-- Subtle Chart Vectors on the Right -->
  <svg class="market-wave" viewBox="0 0 440 191" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 160 L60 145 L110 152 L170 120 L220 135 L280 85 L340 95 L400 45 L440 35" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 160 L60 145 L110 152 L170 120 L220 135 L280 85 L340 95 L400 45 L440 35 V191 H0 Z" fill="url(#green-grad)" opacity="0.15"/>
    <defs>
      <linearGradient id="green-grad" x1="220" y1="35" x2="220" y2="191" gradientUnits="userSpaceOnUse">
        <stop stop-color="#10b981"/>
        <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="content">
    <div class="left-col">
      <div class="brand-row">
        <div class="brand-title">Broker<span class="accent">Lens</span></div>
        <span class="badge-tag">SEBI Registered Brokers</span>
      </div>
      <div class="tagline">
        <strong>Unbiased broker comparisons</strong>, true fee calculators, and virtual paper trading for Indian investors.
      </div>
      <div class="features">
        <div class="feature-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          30+ Broker Comparisons
        </div>
        <div class="feature-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          True Cost Calculator
        </div>
        <div class="feature-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Risk-Free Virtual Trading
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="domain-pill">
        <span class="dot"></span>
        www.brokerlens.in
      </div>
      <div class="sub-note">100% Unbiased Indian Market Data</div>
    </div>
  </div>
</body>
</html>
