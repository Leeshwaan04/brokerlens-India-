name: Virtual Trading CI

# Path-filtered to virtual-trading/ only, so a pipeline-only commit never
# triggers this and a virtual-trading-only commit never triggers ci.yml (the
# static-site QA+VAPT+deploy workflow). The two apps share a repo but have
# fully separate deploy paths, per
# /Users/sumitbagewadi/.claude/plans/graceful-painting-neumann.md.
#
# Deployment: Cloudflare Workers (worker "brokerlens-paper") via
# @opennextjs/cloudflare, see virtual-trading/LAUNCH.md. The deploy job is a
# no-op until the CLOUDFLARE_API_TOKEN repository secret exists, and needs the
# NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository variable (inlined at build time).
# Runtime secrets live on the worker (wrangler secret put), not in GitHub.

on:
  push:
    branches: [main]
    paths: ["virtual-trading/**"]
  pull_request:
    paths: ["virtual-trading/**"]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: virtual-trading

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: virtual-trading/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Build before typecheck: Next.js 16's typed-routes feature (the
      # LayoutProps/PageProps helper types used in app/layout.tsx etc.) is
      # only generated into .next/types by `next build`/`next dev`, so a
      # fresh checkout's `tsc --noEmit` fails with "Cannot find name
      # 'LayoutProps'" if it runs first. Confirmed: this passed locally only
      # because a prior local build had already left .next/types/ on disk.
      - name: Build
        run: npm run build
        env:
          # Placeholder values so a build that only needs env vars to exist
          # (not to be valid/live) does not fail before real secrets are
          # configured. Nothing here is a real credential.
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
          CLERK_SECRET_KEY: "sk_test_placeholder"
          CRON_SECRET: "placeholder"

      - name: Typecheck
        run: npx tsc --noEmit

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: virtual-trading-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 60b50388dc161e3a172c8a5fc35ba3a9
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Skip until Cloudflare is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not configured in GitHub secrets; deploy skipped."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: virtual-trading/package-lock.json

      - name: Check build-time configuration
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository variable (Clerk production publishable key) before deploying."
            exit 1
          fi

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Build worker (OpenNext)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run cf:build

      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx opennextjs-cloudflare deploy
