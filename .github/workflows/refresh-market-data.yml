name: Refresh market data

# Vercel serves static JSON only — no /api/stream. This workflow keeps
# ticker.json and overview market data fresh during Indian market hours.
#
# Required secrets: VERCEL_TOKEN
# Optional (faster deploys): VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  schedule:
    # Every 5 min, Mon–Fri, ~NSE cash session (03:45–10:15 UTC ≈ 09:15–15:45 IST)
    - cron: '*/5 3-10 * * 1-5'
    # Nightly full SEBI + bhavcopy refresh (02:00 IST ≈ 20:30 UTC previous day; use 20:30 UTC)
    - cron: '30 20 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = make all; pulse = live quotes only'
        required: false
        default: pulse
        type: choice
        options:
          - pulse
          - full

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/_ingest.json
          key: ingest-${{ github.run_attempt }}-${{ github.run_id }}
          restore-keys: |
            ingest-

      - name: Seed manual datasets
        run: make seed

      - name: Full ingest and publish
        if: github.event.schedule == '30 20 * * 0-4' || github.event.inputs.mode == 'full'
        env:
          SITE_URL: https://www.brokerlens.in
        run: make all

      - name: Live quote refresh (market hours)
        if: github.event.schedule != '30 20 * * 0-4' && github.event.inputs.mode != 'full'
        env:
          SITE_URL: https://www.brokerlens.in
        run: |
          test -f data/_ingest.json || make fetch
          make pulse

      - name: Build deployable dist
        run: make dist

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is required to publish refreshed data."
            exit 1
          fi
          npm install -g vercel@latest
          cp site/vercel.json dist/vercel.json
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            cd dist && vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            cd dist && vercel deploy --prod --yes --token "$VERCEL_TOKEN" --name brokerlens-india
          fi

      - name: Save ingest cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            data/_ingest.json
          key: ingest-${{ github.run_attempt }}-${{ github.run_id }}
