name: Daily IPO & GMP Automated Refresh

on:
  schedule:
    # Off-peak minutes on purpose: GitHub delays (and under heavy load drops) scheduled
    # runs around :00/:30/:45, when most of the world's crons fire.
    # 09:22 IST = 03:52 UTC (Pre-market morning opening)
    - cron: "52 3 * * 1-5"
    # 18:22 IST = 12:52 UTC (Post-market evening close)
    - cron: "52 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ipo-gmp-refresh
  cancel-in-progress: false

jobs:
  refresh-ipo-gmp:
    name: Refresh IPO GMP & Daily Bulletins
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch regulator and market data
        env:
          SITE_URL: "https://www.brokerlens.in"
        run: |
          python3 -m pipeline.run fetch || true

      - name: Refresh IPO GMP and Rebuild Bulletins
        env:
          SITE_URL: "https://www.brokerlens.in"
        run: |
          python3 scripts/update_ipo_gmp.py

      - name: Commit and Push Updated IPO Data
        id: push
        run: |
          git config --global user.name "BrokerLens Automation Bot"
          git config --global user.email "206470553+Leeshwaan04@users.noreply.github.com"

          git add data/manual/ipo_gmp.json site/data/news.json site/news/ site/ipo/
          if git diff --staged --quiet; then
            echo "No IPO GMP changes detected. Working tree clean."
          else
            git commit -m "chore(ipo): automated daily GMP & bulletin refresh $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            # The fetch+build step above touches far more of site/ than this job's own
            # git add allowlist (that's daily-pipeline.yml's job to publish, on its own
            # schedule) - discard those extra unstaged changes so the working tree is
            # clean before a rebase, which otherwise refuses to run at all.
            git checkout -- .
            # Sibling scheduled workflows (autopilot-content, daily-pipeline) can push to
            # main in the same window and touch overlapping paths. Rebase onto whatever is
            # there now before pushing, instead of letting a stale checkout hit a flat
            # non-fast-forward rejection.
            if git pull --rebase origin main; then
              git push origin main
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "IPO GMP updates pushed to main."
            else
              git rebase --abort
              echo "::warning::Rebase conflict with a concurrent push to main - skipping this run's push. The next scheduled run will regenerate fresh content."
            fi
          fi

      - name: Deploy through the QA + VAPT gate
        if: steps.push.outputs.pushed == 'true'
        # Pushes made with the workflow token never start other workflows, so a bot push
        # alone never ran ci.yml and its content reached production only when a human push
        # happened to land on top. workflow_dispatch is the one trigger that token may fire;
        # ci.yml runs QA + VAPT and only then calls the deploy hook.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
