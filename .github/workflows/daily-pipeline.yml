name: Daily Market Ingest & Build Pipeline

on:
  schedule:
    # 17:53 IST (UTC+5:30) = 12:23 UTC, Monday through Friday (off-peak minute on purpose)
    - cron: "23 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pipeline-run
  cancel-in-progress: false

jobs:
  ingest-and-build:
    name: Run Ingest, Compute & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # Deliberately minimal (see pipeline/requirements.txt's own comment): xlrd is
        # the one documented exception to this pipeline's otherwise
        # stdlib-only policy, needed only to read NSE's Report 1C (legacy
        # binary .xls - no stdlib parsing path exists for that format).
        # Only report1c needs it, and that step already keeps the committed data when
        # xlrd is missing, so a PyPI hiccup must not stop the whole daily run.
        run: pip install -r pipeline/requirements.txt || echo "::warning::pipeline/requirements.txt not installed; report1c will keep the committed data"

      - name: Run Full Pipeline (Fetch + Build)
        env:
          SITE_URL: "https://www.brokerlens.in"
          PUBLISH_MODE: "production"
          SEBI_MAX_PAGES: "100"
        run: |
          echo "Starting daily pipeline ingest at $(date)..."
          # Same order as scripts/vercel-build.sh: every data source first, then one
          # build, so the committed site/ reflects the data committed with it. This
          # used to run `all` (fetch + build) and then complaints/report1c, which left
          # site/ a day behind their data, and skipped them entirely whenever fetch
          # reported a gap (the step runs under bash -e).
          fetch_rc=0
          python3 -m pipeline.run fetch || fetch_rc=$?
          # Broker complaint disclosures and NSE's own active-client report update at
          # most monthly; a bad run here leaves the existing file untouched.
          python3 -m pipeline.run complaints || true
          python3 -m pipeline.run report1c || true
          python3 -m pipeline.run holidays || true
          python3 -m pipeline.run build
          # Keep `all`'s contract: a source gap still fails the run, after the build.
          exit $fetch_rc

      - name: Commit and Push Updated Data & Static Builds
        id: push
        run: |
          git config --global user.name "BrokerLens Pipeline Bot"
          git config --global user.email "206470553+Leeshwaan04@users.noreply.github.com"
          
          git add data/ site/
          if git diff --staged --quiet; then
            echo "No data changes detected. Working tree clean."
          else
            git commit -m "chore(pipeline): automated daily market ingest $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            # Sibling scheduled workflows (daily-ipo-gmp, daily-bhavcopy) can push to main in
            # the same window and touch overlapping paths. Rebase onto whatever is there now
            # before pushing, instead of letting a stale checkout hit a flat non-fast-forward
            # rejection.
            if git pull --rebase origin main; then
              git push origin main
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Changes pushed to main."
            else
              git rebase --abort
              echo "::warning::Rebase conflict with a concurrent push to main - skipping this run's push. The next scheduled run will regenerate fresh content."
            fi
          fi

      - name: Deploy through the QA + VAPT gate
        if: steps.push.outputs.pushed == 'true'
        # Pushes made with the workflow token never start other workflows, so a bot push
        # alone never ran ci.yml and its content reached production only when a human push
        # happened to land on top. workflow_dispatch is the one trigger that token may fire;
        # ci.yml runs QA + VAPT and only then calls the deploy hook.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
