name: Daily NSE Bhavcopy & Market Refresh

on:
  schedule:
    # 18:41 IST = 13:11 UTC (Post-market closing prices; off-peak minute on purpose)
    - cron: "11 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-bhavcopy-refresh
  cancel-in-progress: false

jobs:
  refresh-bhavcopy:
    name: Refresh NSE Bhavcopy & Market Movers
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest Daily Bhavcopy
        env:
          SITE_URL: "https://www.brokerlens.in"
        run: |
          python3 scripts/update_daily_bhavcopy.py
          # Nothing here is committed: data/_ingest.json and every file
          # update_bhavcopy() writes (site/data/ticker.json, and the
          # market-movers.json path this workflow used to also try to add)
          # are all gitignored by design ("Internal, regenerable" / live
          # derived data), so a "Commit and Push" step here could never
          # succeed - git refuses to add an explicitly ignored path. This
          # workflow's real job is making sure the bhavcopy fetch + ticker
          # rebuild itself runs and exits non-zero on a real failure (see
          # update_bhavcopy()'s own ok-tracking), which is already covered
          # by this step alone.

