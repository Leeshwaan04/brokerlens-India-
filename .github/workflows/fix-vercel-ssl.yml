name: Fix brokerlens.in SSL

on:
  workflow_dispatch:

jobs:
  fix-ssl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Vercel domain / certificate mismatch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: brokerlens-india
          VERCEL_TEAM_SLUG: sumit-bagewadis-projects
        run: bash scripts/fix-brokerlens-ssl.sh
