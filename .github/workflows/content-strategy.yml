name: Weekly content strategy report

on:
  schedule:
    - cron: "0 4 * * 1"  # 04:00 UTC Monday = 09:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run content strategy report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/content_strategist.py

      - name: Commit report
        run: |
          git config user.name "brokerlens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/content-strategy/
          git diff --staged --quiet || git commit -m "Content strategy report: $(date -u +%Y-%m-%d)"
          git push
