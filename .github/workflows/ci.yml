name: QA + VAPT, then deploy

# Runs on every push to main so a broken commit shows a red X on GitHub
# within about a minute, independent of whose machine (or which Claude
# session) made the push and whether they ran the local pre-push hook
# (.githooks/pre-push, git config core.hooksPath .githooks).
#
# Added after a missing brace in site/assets/js/pages.js shipped straight
# to production: it broke the whole client-side ES module graph (ticker,
# search, every mega-menu) on every page, and node --check on a plain .js
# file doesn't validate module syntax, so nothing caught it before this.
#
# The `deploy` job below fires the same VERCEL_DEPLOY_HOOK daily-refresh.yml
# uses, only after `test` passes - this is the ONLY deploy path for a push to
# main. Vercel's own git integration (project setting
# gitProviderOptions.createDeployments) is set to "disabled" as of 2026-09-18
# specifically so it can't also deploy ungated the instant a commit lands,
# racing ahead of `test` - a broken commit that fails the `test` job above
# now simply never reaches production, rather than shipping immediately and
# getting caught a few minutes later. To roll this back (re-enable Vercel's
# own auto-deploy), see `vercel api /v9/projects/<id> -X PATCH --input -`
# with `{"gitProviderOptions":{"createDeployments":"enabled"}}` piped in.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # site/ (site/data/*.json, site/stock/, site/sebi-registry/, ...) is
      # gitignored except for a handful of hand-maintained files - a fresh
      # checkout has none of it, so qa_e2e.py's published-payload checks
      # failed on every single run since this workflow was created (verified:
      # both prior runs failed here, exit code 3, "overview.json exists"
      # etc.) without ever reaching a real regression check. `seed` alone
      # (sample broker data only, no network) was tried and still left 23
      # checks failing - there is no sample fallback for the registry, stock,
      # fund, ETF, crypto or IPO families, which most of the QA suite
      # actually exercises. This mirrors scripts/vercel-build.sh exactly
      # (fetch tolerates a source being down, build always runs), verified
      # locally in an isolated worktree to produce a clean 428/428 pass.
      - name: Build site data (mirrors scripts/vercel-build.sh)
        env:
          SITE_URL: https://www.brokerlens.in
          SEBI_MAX_PAGES: "100"
        run: |
          python3 -m pipeline.run fetch || true
          python3 -m pipeline.run complaints || true
          python3 -m pipeline.run build

      # Both suites accept --url to additionally probe a running server
      # (real HTTP routes, the SSE stream, security headers, DoS/slowloris
      # resistance) - discovered 2026-09-19 that nothing had ever actually
      # passed one in here, so every run silently printed "SKIP http + sse
      # checks" and 490+65 real checks (three of which turned out to be
      # failing test bugs, not site bugs) never ran in CI at all. Backed by
      # the same devserver.py the Makefile's `make serve` uses locally.
      - name: Start a local server for the live-probe checks
        run: |
          python3 server/devserver.py --port 8091 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8091/ -o /dev/null && break
            sleep 1
          done

      - name: Run QA end-to-end suite (offline + live server)
        run: python3 tests/qa_e2e.py --url http://127.0.0.1:8091

      - name: Run VAPT suite (offline + live server probes)
        run: python3 tests/vapt.py --url http://127.0.0.1:8091

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Vercel production deploy
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK_URL" -o /dev/null
          echo "Deploy triggered - tests passed on this commit."
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
