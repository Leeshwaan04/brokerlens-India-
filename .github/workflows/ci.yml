name: QA + VAPT, then deploy

# Runs on every push to main so a broken commit shows a red X on GitHub
# within about a minute, independent of whose machine (or which Claude
# session) made the push and whether they ran the local pre-push hook
# (.githooks/pre-push, git config core.hooksPath .githooks).
#
# Added after a missing brace in site/assets/js/pages.js shipped straight
# to production: it broke the whole client-side ES module graph (ticker,
# search, every mega-menu) on every page, and node --check on a plain .js
# file doesn't validate module syntax, so nothing caught it before this.
#
# The site moved from Vercel to Cloudflare Workers Assets in mid-November
# 2026 (commit cc7f523 onward). The "Deploy to Cloudflare Workers Assets"
# step at the end of the `test` job below (`npx wrangler@4.114.0 deploy`) is meant to
# be this pipeline's only deploy path, the same way the old `deploy` job
# (needs: test, curl to VERCEL_DEPLOY_HOOK) was before the migration - but as
# of 16 Nov 2026 CLOUDFLARE_API_TOKEN is NOT set as a repository secret, so
# that step is a silent no-op on every run (its own echo line says so in the
# log). Production has nonetheless been updated repeatedly via a developer or
# agent running `wrangler deploy` by hand, from whatever `site/` happens to
# be on their machine, which never runs tests/qa_e2e.py or tests/vapt.py.
# A red `test` job on GitHub does NOT currently stop a bad change from
# reaching production. To close this gap, add CLOUDFLARE_API_TOKEN as a
# repository secret (Settings > Secrets and variables > Actions) so this
# step starts actually deploying, restoring a single, tested, gated path.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # site/ (site/data/*.json, site/stock/, site/sebi-registry/, ...) is
      # gitignored except for a handful of hand-maintained files - a fresh
      # checkout has none of it, so qa_e2e.py's published-payload checks
      # failed on every single run since this workflow was created (verified:
      # both prior runs failed here, exit code 3, "overview.json exists"
      # etc.) without ever reaching a real regression check. `seed` alone
      # (sample broker data only, no network) was tried and still left 23
      # checks failing - there is no sample fallback for the registry, stock,
      # fund, ETF, crypto or IPO families, which most of the QA suite
      # actually exercises. This mirrors scripts/vercel-build.sh exactly
      # (fetch tolerates a source being down, build always runs), verified
      # locally in an isolated worktree to produce a clean 428/428 pass.
      - name: Install Python dependencies
        # xlrd is the one documented exception to this pipeline's otherwise
        # stdlib-only policy - needed only for NSE's Report 1C, published as
        # legacy binary .xls with no stdlib parsing path (see
        # pipeline/requirements.txt, and why it is not at the repo root).
        # Tolerated like in vercel-build.sh: only the report1c build step needs it,
        # and no QA or VAPT check does, so a PyPI hiccup must not block the gate.
        run: pip install -r pipeline/requirements.txt || echo "::warning::pipeline/requirements.txt not installed; report1c will keep the committed data"

      - name: Build site data (mirrors scripts/vercel-build.sh)
        env:
          SITE_URL: https://www.brokerlens.in
          SEBI_MAX_PAGES: "100"
        run: |
          python3 -m pipeline.run fetch || true
          python3 -m pipeline.run complaints || true
          python3 -m pipeline.run report1c || true
          python3 -m pipeline.run holidays || true
          python3 -m pipeline.run build

      # Both suites accept --url to additionally probe a running server
      # (real HTTP routes, the SSE stream, security headers, DoS/slowloris
      # resistance) - discovered 2026-09-19 that nothing had ever actually
      # passed one in here, so every run silently printed "SKIP http + sse
      # checks" and 490+65 real checks (three of which turned out to be
      # failing test bugs, not site bugs) never ran in CI at all. Backed by
      # the same devserver.py the Makefile's `make serve` uses locally.
      - name: Start a local server for the live-probe checks
        run: |
          python3 server/devserver.py --port 8091 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8091/ -o /dev/null && break
            sleep 1
          done

      - name: Run QA end-to-end suite (offline + live server)
        run: python3 tests/qa_e2e.py --url http://127.0.0.1:8091

      - name: Run VAPT suite (offline + live server probes)
        run: python3 tests/vapt.py --url http://127.0.0.1:8091

      - name: Deploy to Cloudflare Workers Assets
        if: success()
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            # Save what is live before replacing it, so IndexNow gets only new and
            # daily-changing URLs (scripts/indexnow_ping.py). Never fails the deploy.
            python3 scripts/indexnow_ping.py snapshot || true
            echo "Deploying built site to Cloudflare Workers..."
            npx wrangler@4.114.0 deploy
            sleep 20
            python3 scripts/indexnow_ping.py ping || true
          else
            echo "CLOUDFLARE_API_TOKEN not configured in GitHub secrets; deploy step skipped in CI."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 60b50388dc161e3a172c8a5fc35ba3a9
