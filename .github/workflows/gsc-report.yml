name: Search Console daily snapshot

on:
  schedule:
    # 03:07 UTC = 08:37 IST (off-peak minute on purpose) - after GSC's own overnight data processing,
    # well before the working day starts in India.
    - cron: "7 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run GSC snapshot
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/gsc_report.py

      - name: Commit snapshot
        id: push
        run: |
          git config user.name "brokerlens-bot"
          git config user.email "206470553+Leeshwaan04@users.noreply.github.com"
          git add reports/gsc/
          if ! git diff --staged --quiet; then
            git commit -m "Search Console snapshot: $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy through the QA + VAPT gate
        if: steps.push.outputs.pushed == 'true'
        # reports/gsc/stock_demand.json feeds the wave-1 stock sitemap, so a new snapshot
        # can change what the site submits to Google. Same gated path as the other bots.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
