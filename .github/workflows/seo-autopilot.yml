name: SEO autopilot (daily)

# Once a day, the Python SEO autopilot reads fresh Search Console data,
# identifies striking-distance search opportunities, synchronizes search demand
# into wave-1 sitemaps, verifies the site build with full QA and VAPT suites, and
# logs improvements to reports/autopilot/LOG.md.
#
# Production is still only reachable through ci.yml (QA + VAPT, then the
# deploy hook): when autopilot commits changes, it dispatches ci.yml explicitly,
# the same way gsc-report.yml and daily-pipeline.yml do.
#
# Uses existing repository secret: GSC_SERVICE_ACCOUNT_JSON.
# Zero external AI API keys needed (100% Python standard library).

on:
  schedule:
    # 04:40 UTC = 10:10 IST, after the 03:07 UTC Search Console snapshot lands.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse and log only, push nothing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: seo-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_URL: "https://www.brokerlens.in"
      PUBLISH_MODE: "production"
      SEBI_MAX_PAGES: "100"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt || echo "::warning::pipeline/requirements.txt not installed; report1c keeps the committed data"

      - name: Fresh market data (same order as scripts/vercel-build.sh)
        run: |
          python3 -m pipeline.run fetch || true
          python3 -m pipeline.run complaints || true
          python3 -m pipeline.run report1c || true
          python3 -m pipeline.run holidays || true

      - name: Run SEO autopilot
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          AUTOPILOT_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 scripts/seo_autopilot.py ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee autopilot-run.log

      - name: Commit and push changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "brokerlens-autopilot"
          git config user.email "206470553+Leeshwaan04@users.noreply.github.com"
          git add reports/autopilot/LOG.md reports/gsc/
          if ! git diff --staged --quiet; then
            git commit -m "SEO autopilot: daily Search Console optimization $(date -u +%Y-%m-%d)"
            git checkout -- .
            if git pull --rebase origin main; then
              git push origin main
              echo "pushed=true" >> "$GITHUB_ENV"
            else
              git rebase --abort || true
              echo "::warning::Rebase conflict with concurrent push - skipping this run's push."
            fi
          fi

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-run-log
          path: autopilot-run.log
          retention-days: 30

      - name: Deploy through the QA + VAPT gate
        if: env.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Autopilot pushed; ci.yml dispatched."
