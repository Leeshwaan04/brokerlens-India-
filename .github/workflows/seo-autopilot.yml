name: SEO autopilot (daily)

# Once a day, a Claude Code agent reads fresh Search Console data, picks the
# single highest-evidence improvement to clicks, impressions, position or CTR,
# implements it, proves it with a full build plus the QA and VAPT suites, and
# pushes it to main. Its standing instructions are .github/autopilot/PROMPT.md,
# and every run appends what it changed and why to reports/autopilot/LOG.md, so
# later runs can measure earlier changes.
#
# Production is still only reachable through ci.yml (QA + VAPT, then the
# deploy hook): a push made with the workflow token never starts other
# workflows, so the last step dispatches ci.yml explicitly, the same way
# gsc-report.yml and daily-pipeline.yml do.
#
# Needs one repository secret besides the existing GSC_SERVICE_ACCOUNT_JSON:
# ANTHROPIC_API_KEY. Without it the run stops at the first step.

on:
  schedule:
    # 04:40 UTC = 10:10 IST, after the 03:07 UTC Search Console snapshot lands.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse and log only, push nothing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: seo-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SITE_URL: "https://www.brokerlens.in"
      PUBLISH_MODE: "production"
      SEBI_MAX_PAGES: "100"
    steps:
      - name: Stop unless the Anthropic API key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code and the pipeline's one dependency
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install -r pipeline/requirements.txt || echo "::warning::pipeline/requirements.txt not installed; report1c keeps the committed data"

      - name: Fresh market data (same order as scripts/vercel-build.sh)
        run: |
          python3 -m pipeline.run fetch || true
          python3 -m pipeline.run complaints || true
          python3 -m pipeline.run report1c || true
          python3 -m pipeline.run holidays || true

      - name: Run the autopilot agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          AUTOPILOT_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          git config user.name "brokerlens-autopilot"
          git config user.email "206470553+Leeshwaan04@users.noreply.github.com"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          claude -p "$(cat .github/autopilot/PROMPT.md)" \
            --model claude-opus-5-5 \
            --max-turns 250 \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep" \
            --output-format text 2>&1 | tee autopilot-run.log

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-run-log
          path: autopilot-run.log
          retention-days: 30

      - name: Deploy through the QA + VAPT gate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          if [ -n "$(git log "$START_SHA..origin/main" --author=brokerlens-autopilot --oneline)" ]; then
            gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
            echo "Autopilot pushed; ci.yml dispatched."
          else
            echo "Autopilot pushed nothing today."
          fi
