name: Daily content refresh

# Vercel only rebuilds on a git push - a new SEBI registration, a newly
# listed stock, or a new AMFI fund never reaches the live site until someone
# happens to commit something unrelated. This triggers a real rebuild every
# day via a Vercel Deploy Hook, so the site's primary-source data (registry,
# equity/ETF/fund universes, market data) stays current on its own. No new
# content is invented anywhere in this - scripts/vercel-build.sh runs the
# exact same fetch+build pipeline as every other deploy.

on:
  schedule:
    - cron: "13 21 * * *"  # 21:13 UTC = 02:43 IST - well outside market hours
  workflow_dispatch: {}

# It only dispatches ci.yml, so the one permission it needs is to start a
# workflow; nothing else is inherited from the repo's default token.
permissions:
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild through the QA + VAPT gate
        # This used to call the deploy hook directly, so the nightly rebuild
        # shipped whatever the build produced, untested. On 5 to 7 Nov 2026
        # ci.yml failed every run (NSE renamed the mainboard IPO type, and ~490
        # IPO pages vanished) while this job kept deploying the broken build.
        # ci.yml runs the same fresh fetch + build, then QA and VAPT, and only
        # then calls the hook.
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
