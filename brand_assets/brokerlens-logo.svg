<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="BrokerLens">
  <defs>
    <clipPath id="bl-lens-logo-clip">
      <circle cx="32" cy="32" r="17.875"/>
    </clipPath>
  </defs>
  <!-- Mark translated and scaled to 48x48 centered at (32, 32) -->
  <g transform="translate(8, 8) scale(0.09375)">
    <!-- Soft out-of-focus background market trend -->
    <g fill="none" stroke="#2f4a8f" stroke-width="30" stroke-linecap="round">
      <path d="M50 369 L84 359" opacity=".38"/>
      <path d="M18 379 L30 375" opacity=".18"/>
      <path d="M438 161 L470 149" opacity=".38"/>
      <path d="M486 143 L496 140" opacity=".18"/>
    </g>
    <!-- The Lens Ring (Structure) -->
    <circle cx="256" cy="256" r="166" fill="none" stroke="#2f4a8f" stroke-width="46"/>
    <!-- The In-Focus Market Trend (Sharp Uptick inside the Lens) -->
    <g clip-path="url(#bl-lens-full-clip)">
      <path d="M-24 392 L146 340 L212 288 L272 336 L360 190 L528 128" fill="none" stroke="#0f7a4d"
            stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <defs>
    <clipPath id="bl-lens-full-clip">
      <circle cx="256" cy="256" r="143"/>
    </clipPath>
  </defs>
  <!-- Wordmark -->
  <text x="68" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="680" letter-spacing="-0.02em" fill="#1a1a18">BrokerLens</text>
</svg>
